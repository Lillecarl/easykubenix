[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekn"
version = "0.1.0"
description = "easykubenix CLI"
requires-python = ">=3.10"
authors = [
    { name = "easykubenix contributors" },
]
dependencies = [
    "pygit2",
    "pyyaml",
    "clypi",
]

[project.scripts]
ekn = "ekn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ekn"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "../../tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
