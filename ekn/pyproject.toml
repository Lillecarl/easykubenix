[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekn"
version = "0.1.0"
description = "easykubenix CLI"
requires-python = ">=3.10"
authors = [{ name = "easykubenix contributors" }]
dependencies = [
  "nanopynix",
  "nanopynix-helpers",
  "pygit2",
  "pyyaml",
  # `argcomplete`, and not `clypi`. The parser is `argparse`, from the standard
  # library, so this dependency answers a Tab press and nothing else.
  #
  # nanopynix drove every candidate on a pty in bash, zsh and fish, and kept
  # this one: the shell sends it the raw command line and the cursor offset
  # rather than a list of words, so a value holding `:` or `=` survives.
  # `--flake .#app` and `--attr=kube` are those shapes, and they are what `ekn`
  # is typed with. clypi published no way to reach its completion script at
  # all, and resolved the shell through `$SHELL`.
  "argcomplete",
  "kr8s",
  "anyio",
  "structlog",
  "rich",
  "pydantic-core",
]

[project.scripts]
ekn = "ekn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ekn"]

[tool.pyright]
typeCheckingMode = "strict"
# `../tests`, and not `../../tests`. The latter is what this file carried
# while it lived one level deeper in the nanopynix checkout, and it resolved
# to a sibling of that repository root -- a path that has never existed. The
# suite that exercises these modules is easykubenix's own `tests/`.
#
# No `venvPath`/`venv` either. `direnv exec . pyright ekn` runs inside the
# nix shell, whose interpreter already has the whole dependency closure; a
# `.venv` directory is never created here and pointing at a missing one only
# made pyright resolve nothing.
include = ["src", "../tests"]
extraPaths = ["src"]
