[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helmrpc-proto"
version = "0.1.0"
description = "Generated protobuf/grpclib bindings for helmrpc"
requires-python = ">=3.10"
authors = [
    { name = "easykubenix contributors" },
]
dependencies = [
    "protobuf",
    "grpclib",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helmrpc_proto"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
