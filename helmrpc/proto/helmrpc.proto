syntax = "proto3";

package helmrpc;

option go_package = "github.com/lillecarl/easykubenix/helmrpc/pb";

// Helm is served over a stdio-transported gRPC connection, wire-compatible
// with grpclib-transports' StdioChannel (raw HTTP/2 frames on stdin/stdout,
// no handshake, no socket).
service Helm {
  // Ping verifies the stdio transport end to end before any Helm rendering
  // logic is wired in.
  rpc Ping(PingRequest) returns (PingResponse);

  // Render runs `helm template` (client-side dry-run install) against a
  // chart already present on disk and returns the rendered resources as
  // structured values, so callers never round-trip through a second YAML
  // parser the way CLI-wrapping approaches do.
  rpc Render(RenderRequest) returns (RenderResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

// RenderRequest/RenderResponse both wrap a single opaque JSON payload rather
// than typed protobuf fields. google.protobuf.Struct was tried for the
// rendered resources first, but its wire format nests one submessage per
// object/array level -- deep CRD OpenAPI schemas (cert-manager,
// prometheus-operator, ...) routinely exceed upb's hardcoded ~100-message
// decode depth limit that way, and there's no public API to raise it. Once
// resources needed a JSON escape hatch anyway, keeping `values` (and every
// other field) as typed protobuf fields alongside it was just two encodings
// for the same job; this collapses both messages down to one. Adding or
// renaming a field is now a JSON-shape change on both sides, not a .proto
// regeneration.
message RenderRequest {
  bytes request_json = 1;
}

message RenderResponse {
  bytes response_json = 1;
}
