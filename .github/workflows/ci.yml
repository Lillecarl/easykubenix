name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop

# UMBRELLA_GIT makes the umbrella fetch each source over the git protocol,
# and not through api.github.com. Anonymous api.github.com allows 60 calls an
# hour per IP, GitHub's runners share a NAT pool, and every source a job
# resolves is one call. nanopynix issue #301.
env:
  UMBRELLA_GIT: "1"

jobs:
  # One umbrella revision for the whole run.
  #
  # `nix/sources.nix` resolves the umbrella from UMBRELLA_REV when it is set.
  # Without it that reference is unlocked, so every job takes the head of the
  # default branch at the moment it starts. `umbrella land` pushes the working
  # copies, which starts the run, and the umbrella lock commit follows seconds
  # later, so a run that straddles the push reads two umbrellas. Measured in
  # nixkube run 35026926963: seven seconds apart, two store paths, and a later
  # job asking for one nothing had built. nanopynix issue #301.
  #
  # **It resolves the umbrella that locks this commit, not the head of the
  # umbrella default branch.** The head is a moving answer: it is whatever
  # landed most recently, which for a branch nobody landed is not related to
  # this commit at all. `ci/walkback.sh` reads
  # `refs/umbrella/easykubenix/<revision>` from the umbrella remote instead,
  # walking HEAD backwards to the nearest revision the umbrella has locked.
  # One `git ls-remote` and one `git rev-list`, over the git protocol, which
  # the api.github.com limit above does not count.
  #
  # Every job below that runs nix reads it. docs-deploy runs none, and it
  # already waits for docs-build.
  umbrella-rev:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
    steps:
      # A branch nobody landed needs its branch point, so the checkout has to
      # reach that far back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: resolve
        name: Resolve the umbrella revision
        run: |
          rev=$(ci/walkback.sh https://github.com/nixidae/nixidae easykubenix)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

  checks:
    needs: umbrella-rev
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # cachix/install-nix-action, which installs a daemon, and not
      # nixbuild/nix-quick-install-action, which does not.
      #
      # A daemon builds in a sandbox whose build directory is `/build`. A
      # single-user nix builds under the runner's TMPDIR, so a derivation
      # that names `/build` cannot create it and has no way to ask for
      # root. `nix/tofu` sets `HOME = "/build/home"` because tofu writes its
      # plugin cache there, so `checks.tofu-render` failed every run with
      #
      #     mkdir: cannot create directory '/build': Permission denied
      #
      # and took `checks.all` with it. Same class as nixkube's issue #23,
      # and the same fix.
      #
      # The substituters come with it. This job built every dependency from
      # source before, because nothing gave it a cache to read; a daemon
      # ignores substituters a user it does not trust asks for, which is
      # what `trusted-users` is for.
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
            trusted-users = root runner
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
            substituters = https://cache.nixos.org?priority=1 https://lillecarl.cachix.org?priority=2
      # No flake command anywhere in this job. `checks.nix` and `shell.nix` are
      # plain imports, so every gate here also runs from a checkout with no
      # flake support -- which is the point. `all` covers every example, so a
      # new one is gated the moment it joins the list in
      # docs/examples/default.nix, and it covers the repository's own gates
      # (`ekn-sandbox`, `nixfmt`) from nix/default.nix.
      - name: Build checks
        run: nix build --file ./checks.nix all --no-link --print-build-logs
      - name: Validate against real kube-apiserver
        run: nix run --file ./nix packages.validationScript
      - name: Run tests
        run: nix-shell --run 'python3 -m pytest -v --no-header'
      # `ekn/` is this repository's Python source, and nothing else lints or
      # type-checks it. nanopynix' own gates used to, while the source lived
      # there; they read its `../ekn` no longer.
      - name: Lint
        run: nix-shell --run 'ruff check --config ruff-strict.toml'
      - name: Check Python formatting
        run: nix-shell --run 'ruff format --check'
      - name: Check types
        run: nix-shell --run 'pyright ekn'

  docs-build:
    if: github.ref == 'refs/heads/develop'
    needs: [checks, umbrella-rev]
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The same installer as `checks` above, and for the same reason.
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
            trusted-users = root runner
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
            substituters = https://cache.nixos.org?priority=1 https://lillecarl.cachix.org?priority=2

      - uses: cachix/cachix-action@v15
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      # `--file .`, not `.#easykubenix-docs`: same reason as the gates above,
      # a flake must never be the only way to build something here.
      - name: Build documentation
        run: nix build --file . passthru.easykubenix-docs --out-link result --print-build-logs --print-out-paths

      - name: Verify docs closure
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -r --no-preserve=mode,ownership result/. public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  docs-deploy:
    if: github.ref == 'refs/heads/develop'
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
