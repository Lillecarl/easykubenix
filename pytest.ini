[pytest]
# `ekn`'s source lives here, and this is what makes the tests read *this*
# copy of it rather than the one the development environment installs.
#
# The shell's `pynixDevEnv` (from nanopynix) carries an editable `ekn` whose
# path hook is a `.pth` file doing `sys.path.append`, so it lands at the end.
# pytest's `pythonpath` does `sys.path.insert(0, ...)`, so this wins. It is
# not a meta-path finder, which would have won regardless of ordering.
#
# `nanopynix` and `nanopynix-helpers`, and every third-party dependency of
# `ekn`, still come from that environment. See nix/shell.nix.
pythonpath = ekn/src
testpaths = tests
anyio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:pygit2.*
